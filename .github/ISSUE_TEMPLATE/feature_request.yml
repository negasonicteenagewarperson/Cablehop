name: Feature request
description: Suggest something Cablehop could do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Cablehop to do?
      description: Describe the problem it would solve for you.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle this today?
